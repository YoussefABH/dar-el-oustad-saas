<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dar El-Oustad SaaS</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <!-- LOGIN VIEW -->
        <div id="login-view">
            <h1>Dar El-Oustad Pro</h1>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Mot de passe">
            <button id="login-btn">Connexion</button>
            <button id="register-btn">Créer un compte</button>
        </div>

        <!-- DASHBOARD VIEW (directeur) -->
        <div id="dashboard-view" style="display:none;">
            <div class="dashboard-header">
                <h2>Dashboard</h2>
                <div id="center-name" class="center-name"></div>
                <button id="logout-btn" class="logout-btn">Déconnexion</button>
            </div>

            <!-- Section visible uniquement pour le directeur -->
            <div id="director-section" style="display:none;">
                <div class="add-student-section">
                    <h3>Ajouter un étudiant</h3>
                    <div class="form-row">
                        <input type="text" id="student-name" placeholder="Nom complet">
                        <input type="text" id="student-level" placeholder="Niveau">
                        <input type="text" id="student-track" placeholder="Filière">
                        <input type="number" id="student-payment" placeholder="Paiement (DH)">
                        <select id="student-status">
                            <option value="Paid">Payé</option>
                            <option value="Pending">En attente</option>
                        </select>
                        <button id="add-student-btn">Ajouter étudiant</button>
                    </div>
                </div>

                <div class="add-teacher-section">
                    <h3>Ajouter un enseignant</h3>
                    <div class="form-row">
                        <input type="email" id="teacher-email" placeholder="Email enseignant">
                        <input type="text" id="teacher-name" placeholder="Nom complet">
                        <input type="text" id="teacher-subject" placeholder="Matière">
                        <button id="add-teacher-btn">Ajouter enseignant</button>
                    </div>
                    <div id="teachers-list"></div>
                </div>
            </div>

            <!-- Section visible pour tous (directeur + enseignant) -->
            <div class="stats-section">
                <h3>Statistiques</h3>
                <div class="stats-grid">
                    <div class="stat-card">Total : <span id="totalStudents">0</span></div>
                    <div class="stat-card">Payés : <span id="paidStudents">0</span></div>
                    <div class="stat-card">En attente : <span id="pendingStudents">0</span></div>
                    <div class="stat-card">Revenus : <span id="revenue">0</span> DH</div>
                </div>
            </div>

            <div class="students-list-section">
                <h3>Liste des étudiants</h3>
                <div id="students-container"></div>
            </div>
        </div>
    </div>

    <!-- Modal d'édition (identique) -->
    <div id="edit-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Modifier l'étudiant</h3>
            <input type="hidden" id="edit-student-id">
            <input type="text" id="edit-name" placeholder="Nom">
            <input type="text" id="edit-level" placeholder="Niveau">
            <input type="text" id="edit-track" placeholder="Filière">
            <input type="number" id="edit-payment" placeholder="Paiement">
            <select id="edit-status">
                <option value="Paid">Payé</option>
                <option value="Pending">En attente</option>
            </select>
            <button id="save-edit-btn">Enregistrer</button>
        </div>
    </div>

    <script src="js/config/supabase.js"></script>
    <script src="js/utils/dom.js"></script>
    <script src="js/utils/validators.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/center.js"></script>
    <script src="js/modules/students.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/teacher.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
