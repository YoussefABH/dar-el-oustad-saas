<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dar El-Oustad - Diagnostic intégré</title>
    <style>
        body { font-family: monospace; padding: 20px; max-width: 800px; margin: auto; }
        input, button { display: block; width: 100%; padding: 10px; margin: 10px 0; }
        .dashboard { display: none; }
        .error { color: red; background: #ffe0e0; padding: 5px; margin: 5px 0; }
        .success { color: green; }
        .log { background: #f0f0f0; padding: 10px; margin-top: 20px; font-size: 12px; overflow-x: auto; }
        .student-card { border: 1px solid #ccc; padding: 10px; margin: 5px 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="login-view">
        <h2>Connexion</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="login-btn">Se connecter</button>
        <button id="register-btn">Créer un compte</button>
        <div id="error-msg" style="color:red;"></div>
    </div>

    <div id="dashboard-view" class="dashboard">
        <h2>Dashboard</h2>
        <button id="logout-btn">Déconnexion</button>
        <div id="center-info"></div>
        <div id="stats"></div>
        <h3>Liste des étudiants</h3>
        <div id="students-list"></div>
        <div id="diagnostic-log" class="log"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://ecwlqiuvgmikglnfybon.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ROrM2kw2PBgsYr1xq7Oi4w_pThtprFF";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function addDiagnostic(msg, isError = false) {
            const logDiv = document.getElementById('diagnostic-log');
            if (logDiv) {
                const line = document.createElement('div');
                line.textContent = new Date().toLocaleTimeString() + ' : ' + msg;
                if (isError) line.style.color = 'red';
                logDiv.appendChild(line);
            }
            console.log(msg);
        }

        async function afterLogin() {
            addDiagnostic("afterLogin démarré");
            const { data: { user }, error: userErr } = await supabaseClient.auth.getUser();
            if (userErr) { addDiagnostic("Erreur getUser: " + userErr.message, true); return; }
            if (!user) { addDiagnostic("Aucun utilisateur", true); return; }
            addDiagnostic("Utilisateur: " + user.email);

            // Profil
            const { data: profile, error: profErr } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();
            if (profErr) { addDiagnostic("Erreur profiles: " + profErr.message, true); return; }
            addDiagnostic("Profil trouvé: centre_id=" + profile.centre_id + ", role=" + profile.role);
            document.getElementById('center-info').innerHTML = `Centre ID: ${profile.centre_id} - Rôle: ${profile.role}`;

            // Students
            const { data: students, error: stuErr } = await supabaseClient
                .from('students')
                .select('*')
                .eq('centre_id', profile.centre_id);
            if (stuErr) { addDiagnostic("Erreur students: " + stuErr.message, true); return; }
            addDiagnostic("Étudiants trouvés: " + students.length);
            const total = students.length;
            const paid = students.filter(s => s.status === 'Paid').length;
            const pending = students.filter(s => s.status === 'Pending').length;
            const revenue = students.reduce((sum, s) => sum + (Number(s.payment_amount) || 0), 0);
            document.getElementById('stats').innerHTML = `Total: ${total} | Payés: ${paid} | En attente: ${pending} | Revenus: ${revenue} DH`;
            document.getElementById('students-list').innerHTML = students.map(s => `<div class="student-card"><strong>${escapeHtml(s.name)}</strong><br>Niveau: ${s.level || '-'} | Filière: ${s.track || '-'}<br>Paiement: ${s.payment_amount || 0} DH | Statut: ${s.status}</div>`).join('');

            // Teachers (optionnel)
            const { data: teachers, error: teaErr } = await supabaseClient
                .from('teachers')
                .select('*')
                .eq('centre_id', profile.centre_id);
            if (teaErr) addDiagnostic("Erreur teachers: " + teaErr.message, true);
            else addDiagnostic("Enseignants trouvés: " + (teachers?.length || 0));

            // Parents (optionnel)
            const { data: parents, error: parErr } = await supabaseClient
                .from('parents')
                .select('*')
                .eq('centre_id', profile.centre_id);
            if (parErr) addDiagnostic("Erreur parents: " + parErr.message, true);
            else addDiagnostic("Parents trouvés: " + (parents?.length || 0));

            addDiagnostic("Affichage terminé, basculement dashboard");
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
        }

        async function login() {
            addDiagnostic("login() appelée");
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) { 
                addDiagnostic("Erreur connexion: " + error.message, true);
                document.getElementById('error-msg').innerText = error.message;
                return;
            }
            addDiagnostic("Connexion réussie pour " + data.user.email);
            await afterLogin();
        }

        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) { alert("Erreur: " + error.message); }
            else { alert("Compte créé ! Vérifiez votre email ou connectez-vous."); }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('dashboard-view').style.display = 'none';
            addDiagnostic("Déconnecté");
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.getElementById('login-btn').onclick = login;
        document.getElementById('register-btn').onclick = register;
        document.getElementById('logout-btn').onclick = logout;

        // Vérifier session existante
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) afterLogin();
        });
    </script>
</body>
</html>
