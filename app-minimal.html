<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar El-Oustad - Minimal</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        input, button { display: block; width: 100%; padding: 10px; margin: 10px 0; }
        .dashboard { display: none; }
        .stat { background: #f0f0f0; padding: 10px; margin: 10px 0; }
        .student-card { border: 1px solid #ccc; padding: 10px; margin: 5px 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="loginView">
        <h1>Dar El-Oustad</h1>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="loginBtn">Connexion</button>
        <button id="registerBtn">Créer un compte</button>
        <div id="errorMsg" style="color:red;"></div>
    </div>

    <div id="dashboardView" class="dashboard">
        <h2>Dashboard</h2>
        <button id="logoutBtn">Déconnexion</button>
        <div id="centerInfo"></div>
        <div class="stat">Total étudiants : <span id="total">0</span></div>
        <div class="stat">Payés : <span id="paid">0</span></div>
        <div class="stat">En attente : <span id="pending">0</span></div>
        <div class="stat">Revenus : <span id="revenue">0</span> DH</div>
        <h3>Liste des étudiants</h3>
        <div id="studentsList"></div>
    </div>

    <script>
        // Configuration Supabase (identique au test)
        const SUPABASE_URL = "https://ecwlqiuvgmikglnfybon.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ROrM2kw2PBgsYr1xq7Oi4w_pThtprFF";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Éléments DOM
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const errorDiv = document.getElementById('errorMsg');

        function showError(msg) {
            errorDiv.textContent = msg;
            setTimeout(() => errorDiv.textContent = '', 3000);
        }

        // Fonctions
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) {
                showError("Email et mot de passe requis");
                return;
            }
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                showError(error.message);
                return;
            }
            await loadDashboard();
        }

        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || password.length < 6) {
                showError("Email valide et mot de passe de 6+ caractères requis");
                return;
            }
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) {
                showError(error.message);
            } else {
                alert("Compte créé ! Vérifiez vos emails ou connectez-vous.");
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            loginView.style.display = 'block';
            dashboardView.style.display = 'none';
        }

        async function loadDashboard() {
            // Récupérer l'utilisateur
            const { data: { user }, error: userError } = await supabase.auth.getUser();
            if (userError || !user) {
                showError("Utilisateur non trouvé");
                return;
            }

            // Récupérer le profil (centre_id)
            const { data: profile, error: profileError } = await supabase
                .from('profiles')
                .select('centre_id, role')
                .eq('id', user.id)
                .single();
            if (profileError || !profile || !profile.centre_id) {
                showError("Profil ou centre non trouvé. Reconnectez-vous.");
                return;
            }
            document.getElementById('centerInfo').innerHTML = `Centre ID: ${profile.centre_id} - Rôle: ${profile.role}`;

            // Récupérer les étudiants du centre
            const { data: students, error: studentsError } = await supabase
                .from('students')
                .select('*')
                .eq('centre_id', profile.centre_id);
            if (studentsError) {
                showError("Erreur chargement étudiants");
                return;
            }

            // Calculer statistiques
            const total = students.length;
            const paid = students.filter(s => s.status === 'Paid').length;
            const pending = students.filter(s => s.status === 'Pending').length;
            const revenue = students.filter(s => s.status === 'Paid').reduce((sum, s) => sum + (Number(s.payment_amount) || 0), 0);
            document.getElementById('total').textContent = total;
            document.getElementById('paid').textContent = paid;
            document.getElementById('pending').textContent = pending;
            document.getElementById('revenue').textContent = revenue + ' DH';

            // Afficher la liste des étudiants
            const listDiv = document.getElementById('studentsList');
            if (students.length === 0) {
                listDiv.innerHTML = '<p>Aucun étudiant</p>';
            } else {
                listDiv.innerHTML = students.map(s => `<div class="student-card"><strong>${escapeHtml(s.name)}</strong><br>Niveau: ${s.level || '-'} | Filière: ${s.track || '-'}<br>Paiement: ${s.payment_amount || 0} DH | Statut: ${s.status}</div>`).join('');
            }

            // Afficher le dashboard
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Vérifier session existante
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                loadDashboard();
            } else {
                loginView.style.display = 'block';
                dashboardView.style.display = 'none';
            }
        });

        // Écouteurs
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('registerBtn').onclick = register;
        document.getElementById('logoutBtn').onclick = logout;
    </script>
</body>
</html>
