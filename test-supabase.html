<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test de connexion Supabase</h1>
    <button onclick="testLogin()">Tester la connexion</button>
    <pre id="result"></pre>

    <script>
        // REMPLACEZ ICI PAR VOS VRAIES IDENTIFIANTS
        const SUPABASE_URL = "https://ecwlqiuvgmikglnfybon.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ROrM2kw2PBgsYr1xq7Oi4w_pThtprFF";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testLogin() {
            const email = prompt("Entrez votre email:");
            const password = prompt("Entrez votre mot de passe:");
            const resultDiv = document.getElementById("result");
            resultDiv.textContent = "Connexion en cours...";
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    resultDiv.textContent = "Erreur : " + error.message;
                } else {
                    resultDiv.textContent = "Succès ! Utilisateur : " + data.user.email;
                }
            } catch (err) {
                resultDiv.textContent = "Exception : " + err.message;
            }
        }
    </script>
</body>
</html>
