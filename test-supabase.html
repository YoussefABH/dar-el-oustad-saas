<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Supabase fixe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test Supabase</h1>
    <button id="loginBtn">Connexion</button>
    <pre id="log" style="background:#eee; padding:10px;"></pre>

    <script>
        (function() {
            const logDiv = document.getElementById('log');
            function addLog(msg) {
                const p = document.createElement('div');
                p.textContent = new Date().toLocaleTimeString() + ' : ' + msg;
                logDiv.appendChild(p);
                console.log(msg);
            }
            addLog('Script démarré');
            const SUPABASE_URL = "https://ecwlqiuvgmikglnfybon.supabase.co";
            const SUPABASE_ANON_KEY = "sb_publishable_ROrM2kw2PBgsYr1xq7Oi4w_pThtprFF";
            addLog('URL et clé définies');
            
            let sbClient;
            try {
                sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                addLog('Client créé (objet ' + typeof sbClient + ')');
            } catch(e) {
                addLog('ERREUR création client : ' + e.message);
            }

            const btn = document.getElementById('loginBtn');
            btn.onclick = async () => {
                addLog('Clic détecté');
                const email = prompt("Email:");
                if (!email) return;
                const password = prompt("Mot de passe:");
                if (!password) return;
                addLog('Tentative de connexion pour ' + email);
                try {
                    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
                    if (error) {
                        addLog('Erreur auth : ' + error.message);
                    } else {
                        addLog('SUCCÈS : ' + data.user.email);
                    }
                } catch(err) {
                    addLog('Exception : ' + err.message);
                }
            };
            addLog('Prêt, attente clic');
        })();
    </script>
</body>
</html>
